<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Candidate Profile - Business Analyst | Initech</title>
  <link rel="stylesheet" href="/mock.css" />
</head>
<body class="iCIMS_MainWrapper">
  <div class="iCIMS_Header"><h1>Business Analyst</h1></div>
  <!-- iCIMS starts every application with a candidate login (email + privacy acknowledgement); the profile
       form below appears only after "Next". Two fields are not an application, so no launcher yet. -->
  <form id="icims-login" class="iCIMS_Forms">
    <h2>Please Enter Your Information</h2>
    <div class="iCIMS_TableRow"><label for="email">Email Address <span class="iCIMS_Required">*</span></label><input type="email" id="email" name="loginOnlyEmail" /></div>
    <div class="iCIMS_TableRow"><label><input type="checkbox" id="enterEmailAgreement" /> I accept the Privacy Policy.</label></div>
    <button type="button" id="enterEmailSubmitButton">Next</button>
  </form>
  <form id="icims-profile" class="iCIMS_Forms" method="post" action="/submitted.html" hidden>
    <h2>Candidate Profile</h2>
    <div class="iCIMS_TableRow"><label for="PersonProfileFields.FirstName">First Name <span class="iCIMS_Required">*</span></label><input type="text" id="PersonProfileFields.FirstName" name="PersonProfileFields.FirstName" required /></div>
    <div class="iCIMS_TableRow"><label for="PersonProfileFields.LastName">Last Name <span class="iCIMS_Required">*</span></label><input type="text" id="PersonProfileFields.LastName" name="PersonProfileFields.LastName" required /></div>
    <div class="iCIMS_TableRow"><label for="PersonProfileFields.Email">Email <span class="iCIMS_Required">*</span></label><input type="text" id="PersonProfileFields.Email" name="PersonProfileFields.Email" required /></div>
    <div class="iCIMS_TableRow"><label for="PersonProfileFields.PhoneNumber">Phone Number</label><input type="text" id="PersonProfileFields.PhoneNumber" name="PersonProfileFields.PhoneNumber" /></div>
    <div class="iCIMS_TableRow"><label for="PersonProfileFields.AddressStreet1">Address</label><input type="text" id="PersonProfileFields.AddressStreet1" name="PersonProfileFields.AddressStreet1" /></div>
    <div class="iCIMS_TableRow"><label for="PersonProfileFields.AddressCity">City</label><input type="text" id="PersonProfileFields.AddressCity" name="PersonProfileFields.AddressCity" /></div>
    <div class="iCIMS_TableRow"><label for="PersonProfileFields.AddressState">State</label>
      <select id="PersonProfileFields.AddressState" name="PersonProfileFields.AddressState"><option value="">— Make a Selection —</option><option value="CA">California</option><option value="NY">New York</option><option value="TX">Texas</option></select></div>
    <div class="iCIMS_TableRow"><label for="PersonProfileFields.AddressZip">Zip/Postal Code</label><input type="text" id="PersonProfileFields.AddressZip" name="PersonProfileFields.AddressZip" /></div>
    <div class="iCIMS_TableRow"><label for="PersonProfileFields.AddressCountry">Country</label>
      <select id="PersonProfileFields.AddressCountry" name="PersonProfileFields.AddressCountry"><option value="">— Make a Selection —</option><option value="US">United States</option><option value="CA">Canada</option></select></div>
    <div class="iCIMS_TableRow"><label for="ResumeUpload">Resume</label><input type="file" id="ResumeUpload" name="ResumeUpload" /></div>
    <h2>Job Questions</h2>
    <div class="iCIMS_TableRow"><label for="rcf3048">Are you legally authorized to work in the country in which you are applying? <span class="iCIMS_Required">*</span></label>
      <select id="rcf3048" name="rcf3048"><option value="">— Make a Selection —</option><option>Yes</option><option>No</option></select></div>
    <div class="iCIMS_TableRow"><label for="rcf3049">Will you now or in the future require sponsorship for employment visa status? <span class="iCIMS_Required">*</span></label>
      <select id="rcf3049" name="rcf3049"><option value="">— Make a Selection —</option><option>Yes</option><option>No</option></select></div>
    <div class="iCIMS_TableRow"><label for="rcf3050">Are you willing to travel up to 25% of the time? <span class="iCIMS_Required">*</span></label>
      <select id="rcf3050" name="rcf3050"><option value="">— Make a Selection —</option><option>Yes</option><option>No</option></select></div>
    <div class="iCIMS_TableRow"><label><input type="checkbox" name="certify" /> I certify that all statements made in this application are true and complete.</label></div>
    <button type="submit">Submit</button>
  </form>
  <script>
    document.getElementById('enterEmailSubmitButton').addEventListener('click', () => {
      const email = document.getElementById('email').value;
      document.getElementById('icims-login').remove();
      const profile = document.getElementById('icims-profile');
      profile.hidden = false;
      profile.querySelector('[name="PersonProfileFields.Email"]').value = email;
    });
    document.getElementById('icims-profile').addEventListener('submit', (e) => {
      e.preventDefault();
      location.href = '/submitted.html?from=icims';
    });
  </script>
</body>
</html>
